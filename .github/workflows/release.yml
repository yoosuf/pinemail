name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            deb_arch: arm64
            rpm_arch: aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Frontend
        run: |
          cd apps/web
          npm install
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Prepare release archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          TAG=${GITHUB_REF_NAME:-v0.1.0}
          RAW_VERSION="${TAG#v}"
          ARCHIVE_NAME="pinemail-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist_tmp
          cp target/${{ matrix.target }}/release/pinemail dist_tmp/
          cp target/${{ matrix.target }}/release/pinemail-mcp dist_tmp/
          tar -czf ${ARCHIVE_NAME} -C dist_tmp pinemail pinemail-mcp
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

          # Package Linux .deb & .rpm packages
          if [ "${{ matrix.deb_arch }}" != "" ]; then
            DEB_NAME="pinemail_${RAW_VERSION}_${{ matrix.deb_arch }}.deb"
            DEB_ROOT="deb_root"
            mkdir -p "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/DEBIAN"
            cp dist_tmp/pinemail "${DEB_ROOT}/usr/bin/"
            cp dist_tmp/pinemail-mcp "${DEB_ROOT}/usr/bin/"
            printf "Package: pinemail\nVersion: %s\nArchitecture: %s\nMaintainer: Yoosuf <yoosuf@users.noreply.github.com>\nSection: utils\nPriority: optional\nDescription: Tiny single-binary SMTP & SMS catcher for development environments and AI agents.\n" "${RAW_VERSION}" "${{ matrix.deb_arch }}" > "${DEB_ROOT}/DEBIAN/control"
            dpkg-deb --build "${DEB_ROOT}" "${DEB_NAME}"
            cp "${DEB_NAME}" "pinemail_${{ matrix.deb_arch }}.deb"

            # Create RPM structure using rpmbuild
            sudo apt-get update -y && sudo apt-get install -y rpm
            RPM_ROOT="${HOME}/rpmbuild"
            mkdir -p "${RPM_ROOT}/BUILD" "${RPM_ROOT}/RPMS" "${RPM_ROOT}/SOURCES" "${RPM_ROOT}/SPECS" "${RPM_ROOT}/SRPMS"
            printf "Name: pinemail\nVersion: %s\nRelease: 1\nSummary: Tiny single-binary SMTP & SMS catcher\nLicense: MIT\nURL: https://github.com/yoosuf/pinemail\n\n%%description\nPine Mail is a tiny single-binary SMTP & SMS catcher.\n\n%%prep\n\n%%build\n\n%%install\nmkdir -p %%{buildroot}/usr/bin\ninstall -m 755 ${PWD}/dist_tmp/pinemail %%{buildroot}/usr/bin/pinemail\ninstall -m 755 ${PWD}/dist_tmp/pinemail-mcp %%{buildroot}/usr/bin/pinemail-mcp\n\n%%files\n/usr/bin/pinemail\n/usr/bin/pinemail-mcp\n" "${RAW_VERSION}" > "${RPM_ROOT}/SPECS/pinemail.spec"
            rpmbuild -bb --target ${{ matrix.rpm_arch }}-linux "${RPM_ROOT}/SPECS/pinemail.spec"
            cp "${RPM_ROOT}/RPMS/${{ matrix.rpm_arch }}/"*.rpm "pinemail-${RAW_VERSION}-1.${{ matrix.rpm_arch }}.rpm"
            cp "pinemail-${RAW_VERSION}-1.${{ matrix.rpm_arch }}.rpm" "pinemail.${{ matrix.rpm_arch }}.rpm"
          fi

      - name: Prepare release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $TAG = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $ArchiveName = "pinemail-${TAG}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path dist_tmp -Force
          Copy-Item target/${{ matrix.target }}/release/pinemail.exe dist_tmp/
          Copy-Item target/${{ matrix.target }}/release/pinemail-mcp.exe dist_tmp/
          Compress-Archive -Path dist_tmp\* -DestinationPath $ArchiveName
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_NAME=${ArchiveName}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            *.deb
            *.rpm

  create-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
