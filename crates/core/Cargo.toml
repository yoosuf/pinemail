[package]
name = "pinemail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared storage, mail-parsing, signal extraction, and config for Pine Mail — an SMTP mail catcher for development and testing"
repository = "https://github.com/yoosuf/pinemail"
keywords = ["mail", "smtp", "mail-catcher", "testing", "email"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
