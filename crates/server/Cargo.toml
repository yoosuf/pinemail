[package]
name = "pinemail-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SMTP mail server (port 1025) + REST API + Web UI (port 8025) for Pine Mail — a tiny, single-binary mail catcher for development, testing, and agentic email workflows"
repository = "https://github.com/yoosuf/pinemail"
keywords = ["mail", "smtp", "mail-catcher", "testing", "agents"]

[[bin]]
name = "pinemail"
path = "src/main.rs"

[dependencies]
pinemail-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mailin-embedded = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
anyhow = "1"
